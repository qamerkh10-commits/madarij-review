<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#182D3B">
<title>متابعة المراجعة — مدارج</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #182D3B; --navy-2: #22394a; --navy-3: #2c475b;
  --teal: #2E8B85; --teal-2: #24726d; --teal-soft: #e3f1ef;
  --paper: #F6F1E7; --card: #ffffff; --line: #e7dfcf; --line-2: #f0eadf;
  --ink: #1d2a33; --muted: #6b7680; --faint: #9aa3ab;
  --ok: #1f7a4d; --ok-soft: #e2f3e9; --bad: #b3362b; --bad-soft: #fbe7e4;
  --warn: #8a6100; --warn-soft: #fff4cc; --info: #1d4f7a; --info-soft: #dbeaf7; --pub: #4b3d8f; --pub-soft: #e7e2f6;
  --r: 14px; --shadow: 0 1px 2px rgba(24,45,59,.06), 0 4px 16px rgba(24,45,59,.05);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 15px/1.65 'IBM Plex Sans Arabic', Tahoma, sans-serif; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--teal-2); }
.hidden { display: none !important; }
svg.i { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- الهيكل ---------- */
.shell { display: grid; grid-template-columns: 252px 1fr; min-height: 100vh; }
.side { background: var(--navy); color: #dfe8ee; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
.brand { display: flex; align-items: center; gap: 10px; padding: 20px 18px 18px; border-bottom: 1px solid rgba(255,255,255,.08); }
.brand .mark { width: 38px; height: 38px; border-radius: 10px; background: var(--teal); display: grid; place-items: center; color: #fff; }
.brand b { display: block; color: #fff; font-size: 16px; }
.brand span { font-size: 12px; color: #9fb4c2; }
.nav { padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; flex: 1; overflow-y: auto; }
.nav button { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; color: #c9d6df; padding: 10px 12px; border-radius: 10px; cursor: pointer; text-align: right; font-weight: 500; }
.nav button:hover { background: rgba(255,255,255,.06); color: #fff; }
.nav button.on { background: var(--teal); color: #fff; }
.nav .count { margin-inline-start: auto; background: rgba(255,255,255,.18); color: #fff; font-size: 12px; border-radius: 99px; padding: 0 8px; min-width: 22px; text-align: center; }
.nav .count.alert { background: #e0574b; }
.nav .sec { font-size: 11px; font-weight: 700; color: #7f97a6; padding: 14px 12px 4px; letter-spacing: .3px; }
.nav .sec:first-child { padding-top: 2px; }
.nav .pdot { width: 11px; height: 11px; border-radius: 4px; background: var(--pc); flex: none; margin: 0 4px; }
.nav button.proj.on { background: rgba(255,255,255,.12); box-shadow: inset -3px 0 0 var(--pc); }
.pchip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 99px; background: #fff; border: 1px solid var(--line); color: var(--navy); white-space: nowrap; }
.pchip::before { content: ''; width: 8px; height: 8px; border-radius: 3px; background: var(--pc); }
.pcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.pcard { text-align: right; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 0; cursor: pointer; overflow: hidden; display: flex; flex-direction: column; }
.pcard:hover { transform: translateY(-2px); }
.pcard .band { height: 6px; background: var(--pc); }
.pcard .ph { display: flex; align-items: center; gap: 10px; padding: 14px 16px 8px; }
.pcard .ph .ico { width: 38px; height: 38px; border-radius: 10px; background: var(--pc); color: #fff; display: grid; place-items: center; }
.pcard .ph b { font-size: 17px; color: var(--navy); display: block; }
.pcard .ph span { font-size: 12px; color: var(--muted); }
.pcard .pst { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 6px 16px 12px; }
.pcard .pst div { background: var(--paper); border-radius: 9px; padding: 6px 4px; text-align: center; }
.pcard .pst b { display: block; font-size: 19px; color: var(--navy); line-height: 1.2; }
.pcard .pst span { font-size: 11px; color: var(--muted); }
.pcard .pf { border-top: 1px solid var(--line-2); padding: 10px 16px; font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; margin-top: auto; }
.ptog { border: 1px solid var(--line); background: #fff; border-radius: 99px; padding: 2px 9px; font-size: 12px; cursor: pointer; margin: 2px; color: var(--muted); }
.ptog.on { background: var(--pc); border-color: var(--pc); color: #fff; }
.prow { display: grid; grid-template-columns: 1.4fr 1fr 56px 2.4fr 60px; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line-2); }
.prow input[type=color] { width: 46px; height: 36px; padding: 2px; border-radius: 8px; border: 1px solid #d9cfba; background: #fff; }
.prow .dd { display: flex; flex-wrap: wrap; gap: 4px; }
.prow .dd label span { padding: 4px 8px; font-size: 12px; border-radius: 8px; }
.prow.head { font-size: 12px; color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--line); }
.scope { display: inline-flex; align-items: center; gap: 6px; }
.me { padding: 14px; border-top: 1px solid rgba(255,255,255,.08); display: flex; align-items: center; gap: 10px; }
.me .avatar { background: var(--navy-3); color: #fff; }
.me b { display: block; color: #fff; font-size: 14px; line-height: 1.3; }
.me span { font-size: 12px; color: #9fb4c2; }
.me button { margin-inline-start: auto; background: none; border: 0; color: #9fb4c2; cursor: pointer; padding: 6px; border-radius: 8px; }
.me button:hover { color: #fff; background: rgba(255,255,255,.08); }

.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: 0; z-index: 5; background: rgba(246,241,231,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; padding: 14px 28px; }
.top h1 { margin: 0; font-size: 20px; color: var(--navy); }
.top .sub { color: var(--muted); font-size: 13px; }
.top .spacer { flex: 1; }
.top .menu-btn { display: none; }
.content { padding: 24px 28px 60px; max-width: 1200px; width: 100%; }

/* ---------- عناصر ---------- */
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid transparent; border-radius: 10px; padding: 9px 16px; cursor: pointer; font-weight: 600; background: var(--card); color: var(--navy); border-color: var(--line); white-space: nowrap; }
.btn:hover { border-color: #d5cab4; }
.btn.primary { background: var(--teal); border-color: var(--teal); color: #fff; }
.btn.primary:hover { background: var(--teal-2); }
.btn.dark { background: var(--navy); border-color: var(--navy); color: #fff; }
.btn.ghost { background: transparent; }
.btn.sm { padding: 6px 12px; font-size: 13px; border-radius: 9px; }
.btn.icon { padding: 8px; }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 18px 20px; }
.card h3 { margin: 0 0 12px; font-size: 16px; color: var(--navy); display: flex; align-items: center; gap: 8px; }
.card h3 .more { margin-inline-start: auto; font-size: 13px; font-weight: 500; }
.card + .card, .grid + .card, .card + .grid, .kpis + .grid, .grid + .grid { margin-top: 18px; }
.grid { display: grid; gap: 18px; }
.g2 { grid-template-columns: 1.4fr 1fr; }
.g3 { grid-template-columns: repeat(3, 1fr); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 99px; white-space: nowrap; background: var(--line-2); color: var(--muted); }
.st-new { background: #eef0f2; color: #55606a; }
.st-sheikh { background: #f6e6c4; color: #7a5300; }
.st-sent { background: var(--warn-soft); color: var(--warn); }
.st-late { background: var(--bad-soft); color: var(--bad); }
.st-done { background: var(--ok-soft); color: var(--ok); }
.st-fixed { background: var(--info-soft); color: var(--info); }
.st-pub { background: var(--pub-soft); color: var(--pub); }
.due-late { background: var(--bad-soft); color: var(--bad); }
.due-soon { background: var(--warn-soft); color: var(--warn); }
.due-ok { background: var(--teal-soft); color: var(--teal-2); }
.role { font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 99px; }
.role-owner { background: #f6e6c4; color: #7a5300; }
.role-manager { background: var(--info-soft); color: var(--info); }
.role-reviewer { background: var(--teal-soft); color: var(--teal-2); }
.avatar { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; flex: none; background: var(--teal-soft); color: var(--teal-2); }
.empty { text-align: center; color: var(--muted); padding: 28px 12px; }
.empty .big { font-size: 30px; display: block; margin-bottom: 4px; }
input[type=text], input[type=search], input[type=date], input:not([type]), select, textarea {
  width: 100%; padding: 9px 11px; border: 1px solid #d9cfba; border-radius: 10px; background: #fffdf9; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--teal); outline-offset: -1px; border-color: var(--teal); }
textarea { resize: vertical; min-height: 70px; }
label.lb { display: block; font-size: 12px; color: var(--muted); margin-bottom: 3px; font-weight: 500; }
.toggle { position: relative; display: inline-block; width: 40px; height: 22px; flex: none; }
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle span { position: absolute; inset: 0; background: #d5ccbb; border-radius: 99px; transition: .2s; cursor: pointer; }
.toggle span::after { content: ''; position: absolute; top: 3px; right: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: .2s; }
.toggle input:checked + span { background: var(--teal); }
.toggle input:checked + span::after { right: 21px; }
.toggle input:disabled + span { opacity: .45; cursor: not-allowed; }

/* ---------- لوحة التحكم ---------- */
.hello { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.hello h2 { margin: 0; font-size: 24px; color: var(--navy); }
.hello p { margin: 2px 0 0; color: var(--muted); }
.nextday { background: var(--navy); color: #fff; border-radius: 12px; padding: 10px 16px; display: flex; align-items: center; gap: 10px; }
.nextday b { font-size: 15px; } .nextday span { color: #b6c8d4; font-size: 13px; display: block; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; }
.kpis.k4 { grid-template-columns: repeat(4, 1fr); margin-bottom: 18px; }
.banner { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; border-right: 4px solid var(--teal); }
.banner.warn { border-right-color: #e8b730; display: block; }
.item.up { grid-template-columns: 34px 1.2fr 2fr; }
.asg-head, .asg { display: grid; grid-template-columns: 2fr 1fr 150px; gap: 10px; align-items: center; }
.asg-head { font-size: 12px; color: var(--muted); font-weight: 600; padding: 0 0 6px; border-bottom: 1px solid var(--line); }
.asg { padding: 10px 0; border-bottom: 1px solid var(--line-2); }
.asg .t { font-weight: 600; } .asg .s { margin-top: 3px; }
.asg .t a svg { width: 15px; height: 15px; vertical-align: -2px; }
.revmini { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line-2); }
.revmini:last-child { border-bottom: 0; } .revmini .grow { flex: 1; }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; cursor: pointer; text-align: right; box-shadow: var(--shadow); border-top: 4px solid var(--c, var(--teal)); }
.kpi:hover { transform: translateY(-1px); }
.kpi b { display: block; font-size: 30px; line-height: 1.15; color: var(--navy); }
.kpi span { color: var(--muted); font-size: 13px; font-weight: 500; }
.kpi small { display: block; color: var(--faint); font-size: 12px; }
.rows { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 12px; padding: 10px 2px; border-bottom: 1px solid var(--line-2); cursor: pointer; }
.row:last-child { border-bottom: 0; }
.row:hover { background: #fcfaf5; }
.row .t { font-weight: 600; } .row .s { font-size: 13px; color: var(--muted); }
.row .grow { flex: 1; min-width: 0; }
.row .grow .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pipe { display: flex; height: 14px; border-radius: 99px; overflow: hidden; background: var(--line-2); margin: 6px 0 14px; }
.pipe i { display: block; height: 100%; }
.legend { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: 14px; }
.legend .dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-inline-end: 8px; }
.progress { height: 8px; background: var(--line-2); border-radius: 99px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--teal); border-radius: 99px; }
.act { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line-2); font-size: 14px; }
.act:last-child { border-bottom: 0; }
.act .dotc { width: 8px; height: 8px; border-radius: 50%; background: var(--teal); margin-top: 8px; flex: none; }
.act .when { margin-inline-start: auto; color: var(--faint); font-size: 12px; white-space: nowrap; }

/* ---------- المحاضرات ---------- */
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.toolbar .search { flex: 1; min-width: 200px; position: relative; }
.toolbar .search svg { position: absolute; top: 50%; right: 11px; transform: translateY(-50%); color: var(--faint); }
.toolbar .search input { padding-right: 36px; }
.toolbar select { width: auto; min-width: 150px; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.seg button { border: 1px solid var(--line); background: var(--card); padding: 6px 13px; border-radius: 99px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--navy); }
.seg button.on { background: var(--navy); border-color: var(--navy); color: #fff; }
.seg button em { font-style: normal; opacity: .7; margin-inline-start: 4px; }
table.tbl { width: 100%; border-collapse: collapse; }
.tbl th { text-align: right; font-size: 12px; color: var(--muted); font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--line); background: #fbf8f2; white-space: nowrap; }
.tbl td { padding: 12px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
.tbl tbody tr { cursor: pointer; }
.tbl tbody tr:hover td { background: #fcfaf5; }
.tbl .num { color: var(--faint); font-size: 13px; width: 48px; }
.tbl .ttl { font-weight: 600; }
.tablecard { padding: 0; overflow: hidden; }

/* ---------- الدرج الجانبي ---------- */
.veil { position: fixed; inset: 0; background: rgba(24,45,59,.35); z-index: 20; }
.drawer { position: fixed; top: 0; bottom: 0; left: 0; width: min(520px, 100%); background: var(--paper); z-index: 21; box-shadow: 0 0 40px rgba(0,0,0,.18); display: flex; flex-direction: column; }
.drawer header { background: var(--card); border-bottom: 1px solid var(--line); padding: 16px 20px; display: flex; gap: 12px; align-items: flex-start; }
.drawer header h2 { margin: 0; font-size: 18px; color: var(--navy); flex: 1; }
.drawer .body { padding: 18px 20px 40px; overflow-y: auto; flex: 1; }
.meta { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; font-size: 14px; }
.meta dt { color: var(--muted); } .meta dd { margin: 0; font-weight: 500; }
.notes { list-style: none; margin: 0; padding: 0; }
.notes li { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; margin-bottom: 8px; white-space: pre-wrap; }
.files a { display: inline-flex; align-items: center; gap: 6px; margin: 0 0 6px 10px; font-weight: 500; }

/* ---------- مهامي ---------- */
.task { border-right: 4px solid var(--teal); }
.task.late { border-right-color: var(--bad); }
.task.closed { border-right-color: var(--line); opacity: .85; }
.task .head { display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.task .head h4 { margin: 0; font-size: 17px; color: var(--navy); flex: 1; }
.task .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
.task details { margin-top: 10px; }
.task summary { cursor: pointer; color: var(--teal-2); font-weight: 500; font-size: 14px; }

/* ---------- المراجعون ---------- */
.revs { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.rev .top2 { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; }
.rev .top2 b { display: block; color: var(--navy); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.stats div { background: var(--paper); border-radius: 10px; padding: 8px; text-align: center; }
.stats b { display: block; font-size: 20px; color: var(--navy); line-height: 1.2; }
.stats span { font-size: 12px; color: var(--muted); }
.rate { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 4px; }

/* ---------- الفريق والصلاحيات ---------- */
.member-name { min-width: 150px; }
.perm td, .perm th { text-align: center; }
.perm td:first-child, .perm th:first-child { text-align: right; }
.perm tbody tr { cursor: default; }
.perm input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--teal); }
.rolesdesc { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.rolesdesc div { background: var(--paper); border-radius: 12px; padding: 12px 14px; font-size: 14px; }
.rolesdesc b { display: block; margin-bottom: 4px; }
.invite { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--teal-soft); border-radius: 12px; padding: 12px 14px; }
.invite code { direction: ltr; background: #fff; padding: 4px 10px; border-radius: 8px; font-size: 14px; }

/* ---------- الإرسال ---------- */
.item { border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; display: grid; gap: 10px;
        grid-template-columns: 34px 2fr 2fr 1.3fr 1.1fr; align-items: start; background: #fffefb; }
.item > div { min-width: 0; }
.item .n { width: 30px; height: 30px; border-radius: 50%; background: var(--navy); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 13px; margin-top: 22px; }
.item.err { border-color: var(--bad); background: var(--bad-soft); }
.item .msg { grid-column: 2 / -1; color: var(--bad); font-size: 13px; font-weight: 500; }
.item .hint { font-size: 12px; color: var(--teal-2); margin-top: 3px; }
.item .rm { background: none; border: 0; color: var(--faint); cursor: pointer; font-size: 20px; line-height: 1; padding: 0 4px; }
.result { margin-top: 14px; border-radius: 12px; padding: 12px 14px; white-space: pre-line; font-size: 14px; }
.result.ok { background: var(--ok-soft); color: var(--ok); }
.result.bad { background: var(--bad-soft); color: var(--bad); }

/* ---------- السجل ---------- */
.day { font-weight: 700; color: var(--navy); margin: 18px 0 6px; font-size: 14px; }
.day:first-child { margin-top: 0; }

/* ---------- الإعدادات ---------- */
.days { display: flex; gap: 8px; flex-wrap: wrap; }
.days label { cursor: pointer; }
.days input { display: none; }
.days span { display: inline-block; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); font-weight: 500; }
.days input:checked + span { background: var(--navy); color: #fff; border-color: var(--navy); }
.formrow { display: grid; grid-template-columns: 220px 1fr; gap: 14px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line-2); }
.formrow:last-of-type { border-bottom: 0; }
.formrow p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }

/* ---------- الدخول ---------- */
.login { min-height: 100vh; display: grid; place-items: center; padding: 20px; background:
  radial-gradient(circle at 80% 0%, rgba(46,139,133,.16), transparent 45%), var(--paper); }
.login .box { width: min(440px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 20px; box-shadow: 0 10px 40px rgba(24,45,59,.10); padding: 32px 28px; text-align: center; }
.login .mark { width: 60px; height: 60px; border-radius: 16px; background: var(--navy); color: #fff; display: grid; place-items: center; margin: 0 auto 14px; }
.login .mark svg { width: 28px; height: 28px; }
.login h1 { margin: 0; font-size: 22px; color: var(--navy); }
.login .lead { color: var(--muted); margin: 4px 0 22px; }
.steps { text-align: right; list-style: none; padding: 0; margin: 0 0 20px; counter-reset: s; }
.steps li { counter-increment: s; display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-bottom: 1px dashed var(--line); }
.steps li:last-child { border-bottom: 0; }
.steps li::before { content: counter(s, arabic-indic); width: 28px; height: 28px; border-radius: 50%; background: var(--teal-soft); color: var(--teal-2); display: grid; place-items: center; font-weight: 700; flex: none; }
.steps code { background: var(--paper); padding: 1px 8px; border-radius: 6px; direction: ltr; display: inline-block; font-weight: 600; }

/* ---------- تنبيهات ---------- */
.toasts { position: fixed; bottom: 20px; left: 20px; z-index: 40; display: flex; flex-direction: column; gap: 8px; }
.toast { background: var(--navy); color: #fff; padding: 11px 16px; border-radius: 12px; box-shadow: 0 6px 24px rgba(0,0,0,.2); font-size: 14px; max-width: 360px; animation: up .2s ease; }
.toast.bad { background: var(--bad); }
@keyframes up { from { transform: translateY(8px); opacity: 0; } }
[data-act=refresh].syncing svg { animation: sp 1s linear infinite; }
.loading { padding: 60px 0; text-align: center; color: var(--muted); }
.spin { width: 26px; height: 26px; border: 3px solid var(--line); border-top-color: var(--teal); border-radius: 50%; animation: sp 1s linear infinite; margin: 0 auto 10px; }
@keyframes sp { to { transform: rotate(360deg); } }

/* ---------- الموبايل ---------- */
@media (max-width: 1100px) { .g2 { grid-template-columns: 1fr; } }
@media (max-width: 900px) {
  .shell { grid-template-columns: 1fr; }
  .side { position: fixed; right: 0; top: 0; bottom: 0; width: 270px; z-index: 30; transform: translateX(100%); transition: transform .2s; }
  .side.open { transform: none; }
  .top .menu-btn { display: inline-flex; }
  .top { padding: 12px 16px; }
  .top h1 { font-size: 18px; }
  .content { padding: 16px 16px 60px; }
  .kpis, .kpis.k4 { grid-template-columns: repeat(2, 1fr); }
  .grid > * { min-width: 0; }
  .row { flex-wrap: wrap; }
  .row .grow { flex-basis: 100%; }
  .card h3 { flex-wrap: wrap; }
  .asg-head { display: none; }
  .asg { grid-template-columns: 1fr 1fr; }
  .asg .grow { grid-column: 1 / -1; }
  .item.up { grid-template-columns: 30px 1fr; }
  .g3, .rolesdesc { grid-template-columns: 1fr; }
  .item { grid-template-columns: 30px 1fr; }
  .item .n { margin-top: 0; grid-row: span 4; }
  .formrow { grid-template-columns: 1fr; gap: 6px; }
  .tbl.stack thead { display: none; }
  .tbl.stack tr { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 12px 14px; border-bottom: 1px solid var(--line-2); }
  .tbl.stack td { padding: 0; border: 0; }
  .tbl.stack td.num, .tbl.stack td.hide-m { display: none; }
  .tbl.stack td.ttl { grid-column: 1; }
  .tbl.stack td.stc { grid-column: 2; grid-row: 1; }
  .tbl.stack td.sub { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
  .prow { grid-template-columns: 1fr 1fr; }
  .prow.head { display: none; }
  .prow .dd { grid-column: 1 / -1; }
  .scroll-x { overflow-x: auto; }
  .toasts { left: 12px; right: 12px; }
}
</style>
</head>
<body>

<!-- الدخول -->
<div id="login" class="login hidden">
  <div class="box">
    <div class="mark"><svg class="i" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg></div>
    <h1>متابعة المراجعة</h1>
    <p class="lead">الدخول بحساب تليجرام بتاعك</p>
    <ol class="steps">
      <li><div>افتح بوت المراجعة على تليجرام <div id="botBtnWrap"></div></div></li>
      <li><div>ابعتله الأمر <code>/login</code></div></li>
      <li><div>اضغط زرار <b>«🔐 ادخل الموقع»</b> اللي هيوصلك</div></li>
    </ol>
    <p class="small muted">الموقع للمودريتور والشيخ بس. المراجعين شغلهم كله على البوت.</p>
    <div id="loginMsg"></div>
  </div>
</div>

<!-- التطبيق -->
<div id="app" class="shell hidden">
  <aside class="side" id="side">
    <div class="brand">
      <div class="mark"><svg class="i" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg></div>
      <div><b>متابعة المراجعة</b><span>مدارج التفقه</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="me" id="meBox"></div>
  </aside>
  <div class="main">
    <header class="top">
      <button class="btn icon ghost menu-btn" data-act="menu" aria-label="القائمة"><svg class="i" viewBox="0 0 24 24"><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="18" y2="18"/></svg></button>
      <div><h1 id="pageTitle"></h1><div class="sub" id="pageSub"></div></div>
      <div class="spacer"></div>
      <button class="btn sm" data-act="refresh" title="تحديث"><svg class="i" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg><span>تحديث</span></button>
    </header>
    <main class="content" id="view"><div class="loading"><div class="spin"></div>جاري التحميل…</div></main>
  </div>
</div>
<div class="veil hidden" id="veil" data-act="close"></div>
<aside class="drawer hidden" id="drawer"></aside>
<div class="toasts" id="toasts"></div>

<script>
(function () {
'use strict';

// ================= أدوات =================
var STORE = 'madarij-review-v2';
var S = { api: '', session: '', bot: '', name: '' };
var D = null;                       // بيانات السيرفر
var PAGE = '';
var PROJ = '';                      // المشروع المفتوح ('' = كل المشاريع)
var F = { q: '', st: 'all', rev: '' };
var DRAFT = 'madarij-review-draft-v2';

var DAYS = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
var MONTHS = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
var ST = { NEW: 'جديدة', SHEIKH: 'عند الشيخ', SENT: 'عند المراجع', LATE: 'متأخرة', DONE: 'سُلّمت', FIXED: 'عُدّلت', PUB: 'نُشرت' };
var ST_CLASS = { 'جديدة': 'st-new', 'عند الشيخ': 'st-sheikh', 'عند المراجع': 'st-sent', 'متأخرة': 'st-late', 'سُلّمت': 'st-done', 'عُدّلت': 'st-fixed', 'نُشرت': 'st-pub' };
var ST_COLOR = { 'جديدة': '#b9c0c6', 'عند الشيخ': '#c99a2e', 'عند المراجع': '#e8b730', 'متأخرة': '#d4554a', 'سُلّمت': '#2f9e66', 'عُدّلت': '#3b7fc0', 'نُشرت': '#7b68c8' };

var IC = {
  home: '<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>',
  check: '<rect width="8" height="4" x="8" y="2" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/>',
  book: '<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
  send: '<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
  users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/><path d="m9 12 2 2 4-4"/>',
  clock: '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/>',
  sliders: '<line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/>',
  out: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/>',
  search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  file: '<path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/>',
  x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  cal: '<rect width="18" height="18" x="3" y="4" rx="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/>',
  plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
  grid: '<rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/>',
  folder: '<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>',
  copy: '<rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
};
function icon(n) { return '<svg class="i" viewBox="0 0 24 24">' + IC[n] + '</svg>'; }

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function n(x) { return String(x).replace(/\d/g, function (d) { return '٠١٢٣٤٥٦٧٨٩'[d]; }); }
function utc(ymd) { var p = ymd.split('-').map(Number); return Date.UTC(p[0], p[1] - 1, p[2], 10); }
function diff(a, b) { return Math.round((utc(b) - utc(a)) / 86400000); }
function arDate(ymd, short) {
  if (!ymd) return '—';
  var d = new Date(utc(ymd));
  return (short ? '' : DAYS[d.getUTCDay()] + ' ') + n(d.getUTCDate()) + ' ' + MONTHS[d.getUTCMonth()];
}
function daysTxt(k) { k = Math.abs(k); return k === 1 ? 'يوم' : k === 2 ? 'يومين' : k <= 10 ? n(k) + ' أيام' : n(k) + ' يوم'; }
function rel(ymd) {
  if (!ymd || !D) return '';
  var d = diff(D.today, ymd);
  return d < 0 ? 'متأخرة ' + daysTxt(d) : d === 0 ? 'النهارده' : d === 1 ? 'بكرة' : 'بعد ' + daysTxt(d);
}
function relClass(ymd) { var d = diff(D.today, ymd); return d < 0 ? 'due-late' : d <= 1 ? 'due-soon' : 'due-ok'; }
function hourTxt(h) {
  var x = h % 12 || 12;
  return n(x) + ' ' + (h < 5 ? 'بالليل' : h < 12 ? 'الصبح' : h < 15 ? 'الضهر' : h < 18 ? 'العصر' : 'بالليل');
}
function isOpen(l) { return l.status === ST.SENT || l.status === ST.LATE; }
function isLate(l) { return isOpen(l) && (l.status === ST.LATE || l.lateDays > 0); }
function chip(st) { return '<span class="chip ' + (ST_CLASS[st] || '') + '">' + esc(st) + '</span>'; }
function roleChip(r) { return '<span class="role ' + (r === 'مالك' ? 'role-owner' : r === 'مدير' ? 'role-manager' : 'role-reviewer') + '">' + esc(r) + '</span>'; }
function initial(name) { return esc(String(name || '؟').trim().charAt(0)); }
function noteList(l) { return l.notes ? l.notes.split(/\n(?=• )/).map(function (x) { return x.replace(/^• /, ''); }) : []; }
function me() { return D.me; }
function can(p) { return D.me.isOwner || !!D.me.perms[p]; }

function save() { try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (e) {} }
var CACHE = 'madarij-review-data-v2';
function saveCache() { try { localStorage.setItem(CACHE, JSON.stringify({ s: S.session.slice(0, 12), d: D })); } catch (e) {} }
function loadCache() { try { var c = JSON.parse(localStorage.getItem(CACHE) || 'null'); return c && c.s === S.session.slice(0, 12) ? c.d : null; } catch (e) { return null; } }
function dropCache() { try { localStorage.removeItem(CACHE); } catch (e) {} }
function syncing(on) { var b = document.querySelector('[data-act=refresh]'); if (b) b.classList.toggle('syncing', on); }
function load() { try { var x = JSON.parse(localStorage.getItem(STORE) || 'null'); if (x) S = x; } catch (e) {} }

function toast(msg, bad) {
  var t = document.createElement('div');
  t.className = 'toast' + (bad ? ' bad' : '');
  t.textContent = msg;
  $('toasts').appendChild(t);
  setTimeout(function () { t.remove(); }, bad ? 6000 : 3200);
}
function busy(btn, on, txt) {
  if (!btn) return;
  if (on) { btn.dataset.html = btn.innerHTML; btn.disabled = true; btn.innerHTML = txt || '⏳ لحظة…'; }
  else { btn.disabled = false; if (btn.dataset.html) btn.innerHTML = btn.dataset.html; }
}

// ================= السيرفر =================
function api(action, args) {
  return fetch(S.api, { method: 'POST', body: JSON.stringify({ action: action, session: S.session, args: args || {} }) })
    .then(function (r) { return r.json(); }, function () { throw new Error('مش قادر أوصل للسيرفر — اتأكد من النت وحاول تاني'); })
    .then(function (j) {
      if (!j.ok) {
        if (j.auth) { S.session = ''; save(); dropCache(); showLogin(j.error); }
        throw new Error(j.error || 'حصل خطأ');
      }
      if (j.boot) { D = j.boot; saveCache(); }   // العمليات بترجّع البيانات الجديدة في نفس الرد
      return j.result;
    });
}

function refresh(silent) {
  syncing(true);
  return api('bootstrap').then(function (d) {
    syncing(false);
    D = d; S.bot = d.bot || S.bot; S.name = d.me.name; save(); saveCache();
    var ae = document.activeElement;
    if (silent && D && ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName) && $('view').contains(ae)) return;  // ما نقاطعش اللي بيكتب
    if (!PAGE || !allowed(PAGE)) PAGE = defaultPage(d);
    render();
    if (!silent) {}
  }).catch(function (e) { syncing(false); if (S.session) toast(e.message, true); });
}

// ================= الصفحات =================
// الموقع لاتنين بس: المودريتور (رفع الملفات والمتابعة) والشيخ (التوزيع)
var PAGES = [
  { k: 'home', t: 'كل المشاريع', i: 'grid', ok: function () { return D.me.isOwner; } },
  { k: 'dash', t: 'لوحة التحكم', i: 'home', scoped: 1, ok: function () { return D.me.isOwner; } },
  { k: 'files', t: 'الملفات', i: 'book', scoped: 1, ok: function () { return D.me.isOwner; } },
  { k: 'upload', t: 'رفع ملفات', i: 'send', scoped: 1, ok: function () { return D.me.isOwner; } },
  { k: 'log', t: 'سجل النشاط', i: 'clock', scoped: 1, ok: function () { return D.me.isOwner; } },
  { k: 'sheikh', t: 'صفحة الشيخ', i: 'shield', ok: function () { return can('assign'); } },
  { k: 'team', t: 'الفريق', i: 'users', ok: function () { return D.me.isOwner; } },
  { k: 'settings', t: 'الإعدادات والمشاريع', i: 'sliders', ok: function () { return D.me.isOwner; } },
];
function defaultPage(d) { return d.me.isOwner ? 'home' : 'sheikh'; }
function allowed(k) { var p = PAGES.filter(function (x) { return x.k === k; })[0]; return p && p.ok(); }

// ---------- المشاريع ----------
function projs() { return (D.projects || []).filter(function (p) { return p.mine && p.active; }); }
function projOf(name) { return (D.projects || []).filter(function (p) { return p.name === name; })[0] || { name: name || '—', item: 'محاضرة', color: '#2E8B85', nextWorkDay: D.nextWorkDay, defaultDue: D.defaultDue }; }
function scoped() { return PROJ ? D.lectures.filter(function (l) { return l.project === PROJ; }) : D.lectures; }
function pchip(name) { return '<span class="pchip" style="--pc:' + esc(projOf(name).color) + '">' + esc(name) + '</span>'; }
function setProj(name) { PROJ = name || ''; S.proj = PROJ; save(); }
function byStatus(L, st) { return L.filter(function (l) { return l.status === st; }); }
function fileLink(l, txt) { return /^https?:/.test(l.file) ? '<a href="' + esc(l.file) + '" target="_blank" rel="noopener">' + (txt || icon('file')) + '</a>' : ''; }
function rcvChip(l) { return isOpen(l) ? (l.received ? '<span class="chip st-done" title="ضغط «استلمت المراجعة»">استلم ✓</span>' : '<span class="chip st-new">ما استلمش</span>') : ''; }

function render() {
  if (!D) return;
  if (PROJ && !projs().some(function (p) { return p.name === PROJ; })) setProj('');
  var page = PAGES.filter(function (p) { return p.k === PAGE; })[0];
  var btn = function (p, extra) {
    return '<button class="' + (p.k === PAGE ? 'on' : '') + '" data-act="go" data-k="' + p.k + '">' + icon(p.i) + '<span>' + p.t + '</span>' + (extra || '') + '</button>';
  };
  var html = '';
  var atSheikh = D.lectures.filter(function (l) { return l.status === ST.SHEIKH; }).length;
  if (D.me.isOwner) {
    html += '<div class="sec">المشاريع</div>' + btn(PAGES[0]);
    html += projs().map(function (p) {
      var L = D.lectures.filter(function (l) { return l.project === p.name; });
      var late = L.filter(isLate).length, fresh = byStatus(L, ST.NEW).length;
      var c = late ? '<span class="count alert">' + n(late) + '</span>' : fresh ? '<span class="count">' + n(fresh) + '</span>' : '';
      return '<button class="proj' + (PROJ === p.name && page && page.scoped ? ' on' : '') + '" style="--pc:' + esc(p.color) + '" data-act="proj" data-p="' + esc(p.name) + '"><span class="pdot"></span><span>' + esc(p.name) + '</span>' + c + '</button>';
    }).join('');
    html += '<div class="sec">' + (PROJ ? 'صفحات «' + esc(PROJ) + '»' : 'كل المشاريع مع بعض') + '</div>';
    html += PAGES.filter(function (p) { return p.scoped; }).map(function (p) {
      var fresh = p.k === 'upload' ? scoped().filter(function (l) { return l.status === ST.NEW; }).length : 0;
      return btn(p, fresh ? '<span class="count">' + n(fresh) + '</span>' : '');
    }).join('');
    html += '<div class="sec">عام</div>' + btn(PAGES[5], atSheikh ? '<span class="count">' + n(atSheikh) + '</span>' : '') + btn(PAGES[6]) + btn(PAGES[7]);
  } else {
    html += btn(PAGES[5], atSheikh ? '<span class="count alert">' + n(atSheikh) + '</span>' : '');
  }
  $('nav').innerHTML = html;
  $('meBox').innerHTML = '<div class="avatar">' + initial(D.me.name) + '</div><div><b>' + esc(D.me.name) + '</b><span>' + esc(D.me.role) + '</span></div>' +
    '<button data-act="logout" title="خروج">' + icon('out') + '</button>';
  var title = page.scoped && PROJ ? PROJ + ' · ' + page.t : page.t;
  $('pageTitle').innerHTML = page.scoped && PROJ ? '<span class="scope">' + pchip(PROJ) + ' ' + esc(page.t) + '</span>' : esc(page.t);
  $('pageSub').textContent = arDate(D.today) + (page.scoped && !PROJ ? ' · كل المشاريع' : '');
  document.title = title + ' — متابعة المراجعة';
  var fn = { home: pHome, dash: pDash, files: pFiles, upload: pUpload, log: pLog, sheikh: pSheikh, team: pTeam, settings: pSettings }[PAGE];
  $('view').innerHTML = fn();
  if (PAGE === 'files') drawRows();
  if (PAGE === 'upload') initUpload();
}

function go(k) {
  if (k === 'home') setProj('');
  PAGE = k; $('side').classList.remove('open'); $('veil').classList.add('hidden');
  try { history.replaceState(null, '', '#/' + k); } catch (e) {}
  render(); window.scrollTo(0, 0);
}

function kpiRow(L, sub) {
  return [
    [ST.NEW, 'لسه ما اتبعتتش للشيخ', byStatus(L, ST.NEW).length, '#9aa3ab'],
    [ST.SHEIKH, 'عند الشيخ', byStatus(L, ST.SHEIKH).length, '#c99a2e'],

function pLog() {
  var LG = scopedLog();
  if (!LG.length) return '<div class="card empty"><span class="big">🧾</span>لسه مفيش نشاط</div>';
  var out = '', last = '';
  LG.forEach(function (a) {
    var day = a.at.split(' ')[0];
    if (day !== last) { out += '<div class="day">' + (day === D.today ? 'النهارده' : arDate(day)) + '</div>'; last = day; }
    out += '<div class="act"><span class="dotc"></span><div><b>' + esc(a.who) + '</b> ' + esc(a.what) +
      (a.lecture ? ' <span class="muted">— «' + esc(a.lecture) + '»</span>' : '') + (!PROJ && a.project ? ' ' + pchip(a.project) : '') + '</div><span class="when">' + n(a.at.split(' ')[1] || '') + '</span></div>';
  });
  return '<div class="card">' + out + '</div>';
}

// ================= الأحداث =================
function done_(a, msg) { return function () { busy(a, false); if (msg) toast(msg); closeAll(); render(); }; }
function fail_(a) { return function (er) { busy(a, false); toast(er.message, true); }; }

document.addEventListener('click', function (e) {
  var a = e.target.closest('[data-act]');
  if (!a) return;
  var act = a.dataset.act;
  if (a.tagName === 'A' && a.getAttribute('href') === '#') e.preventDefault();
  switch (act) {
    case 'go': go(a.dataset.k); break;
    case 'proj': setProj(a.dataset.p); F.st = 'all'; F.rev = ''; F.q = ''; go('dash'); break;
    case 'menu': $('side').classList.add('open'); $('veil').classList.remove('hidden'); break;
    case 'close': closeAll(); break;
    case 'refresh': busy(a, true, '…'); refresh().then(function () { busy(a, false); toast('اتحدّث ✓'); }); break;
    case 'logout':
      if (!confirm('تخرج من الموقع على الجهاز ده؟')) return;
      api('logout').catch(function () {}); S.session = ''; save(); dropCache(); D = null; showLogin(); break;
    case 'filter': F.st = a.dataset.st; F.rev = ''; F.q = ''; go('files'); break;
    case 'seg': F.st = a.dataset.st; render(); break;
    case 'shp': SHP = a.dataset.p; render(); break;
    case 'lec': openLecture(a.dataset.id); break;
    case 'copy':
      try { navigator.clipboard.writeText(a.dataset.text); toast('اتنسخ ✓'); } catch (er) { toast(a.dataset.text); }
      break;

    // --- المودريتور: رفع وإرسال للشيخ ---
    case 'add-item': { var it = readItems(); it.push(blank()); drawItems(it); saveDraft(); break; }
    case 'rm-item': { var its = readItems(); its.splice(Number(a.dataset.i), 1); drawItems(its.length ? its : [blank()]); saveDraft(); break; }
    case 'save-files': {
      var items = readItems().filter(function (x) { return x.title.trim() || x.link.trim(); });
      if (!items.length) { toast('اكتب ملف واحد على الأقل', true); return; }
      var sendNow = !!a.dataset.send;
      busy(a, true, '⏳ جاري الحفظ…');
      api('addFiles', { project: upProj(), sendNow: sendNow, items: items }).then(function (res) {
        busy(a, false);
        var txt = '';
        if (res.ok.length) txt += '✅ اتحفظ (' + n(res.ok.length) + '): ' + res.ok.join('، ') + (sendNow ? '\n📨 واتبعت للشيخ: ' + n(res.sent) : '');
        if (res.bad.length) txt += (txt ? '\n\n' : '') + '⚠️ ما اتحفظش (' + n(res.bad.length) + ') — صلّحه وجرّب تاني.';
        render();
        drawItems(res.bad.length ? res.bad.map(function (b) { return { title: b.title, link: b.link, error: b.error }; }) : [blank(), blank(), blank(), blank()]);
        saveDraft();
        $('upResult').innerHTML = '<div class="result ' + (res.bad.length ? 'bad' : 'ok') + '">' + esc(txt) + '</div>';
      }).catch(fail_(a));
      break;
    }
    case 'send-new': {
      if (!confirm('أبعت كل الملفات الجديدة للشيخ؟ كل ملف هيروح في رسالة لوحده.')) return;
      busy(a, true);
      api('sendToSheikh', {}).then(function (r) { busy(a, false); toast('📨 اتبعت للشيخ: ' + n(r.sent) + ' ملف'); render(); }).catch(fail_(a));
      break;
    }
    case 'send-one': busy(a, true); api('sendToSheikh', { ids: [Number(a.dataset.id)] }).then(done_(a, '📨 اتبعت للشيخ')).catch(fail_(a)); break;
    case 'del-file':
      if (!confirm('تمسح الملف ده من النظام؟')) return;
      busy(a, true); api('deleteFile', { id: Number(a.dataset.id) }).then(done_(a, 'اتمسح')).catch(fail_(a)); break;

    // --- الشيخ: توزيع وتنبيه ---
    case 'assign-rows': {
      var rows = Array.prototype.map.call(document.querySelectorAll('.asg'), function (r) {
        return { id: Number(r.dataset.id), reviewer: r.querySelector('[name=rev]').value, due: r.querySelector('[name=due]').value };
      }).filter(function (x) { return x.reviewer; });
      if (!rows.length) { toast('اختار مراجع لملف واحد على الأقل', true); return; }
      busy(a, true, '⏳ جاري الإرسال…');
      api('assign', { items: rows }).then(function (res) {
        busy(a, false); render();
        var txt = (res.ok.length ? '✅ اتبعت (' + n(res.ok.length) + '):\n' + res.ok.join('\n') : '') +
          (res.bad.length ? (res.ok.length ? '\n\n' : '') + '⚠️ ما اتبعتش:\n' + res.bad.map(function (b) { return b.error; }).join('\n') : '');
        if ($('asgResult')) $('asgResult').innerHTML = '<div class="result ' + (res.bad.length ? 'bad' : 'ok') + '">' + esc(txt) + '</div>';
        toast(res.ok.length ? 'اتبعت للمراجعين ✓' : 'ما اتبعتش حاجة', !res.ok.length);
      }).catch(fail_(a));
      break;
    }
    case 'assign-one': {
      var rv = $('dRev').value;
      if (!rv) { toast('اختار المراجع', true); return; }
      busy(a, true);
      api('assign', { items: [{ id: Number(a.dataset.id), reviewer: rv, due: $('dDue').value }] }).then(function (res) {
        if (res.bad.length) { busy(a, false); toast(res.bad[0].error, true); return; }
        done_(a, '✅ اتبعت لـ ' + rv)();
      }).catch(fail_(a));
      break;
    }
    case 'nudge': busy(a, true); api('nudge', { id: Number(a.dataset.id) }).then(function (name) { busy(a, false); toast('🔔 اتبعت تنبيه لـ ' + name); }).catch(fail_(a)); break;

    // --- المودريتور: الحالة والملاحظات ---
    case 'setst': busy(a, true); api('setStatus', { id: Number(a.dataset.id), status: $('stSel').value }).then(done_(a, 'اتغيّرت الحالة ✓')).catch(fail_(a)); break;
    case 'note': {
      var nid = a.dataset.id, ta = $('note-' + nid), text = ta ? ta.value.trim() : '';
      if (!text) { toast('اكتب الملاحظة الأول', true); return; }
      busy(a, true);
      api('addNote', { id: Number(nid), text: text }).then(function () { toast('اتضافت الملاحظة ✓'); render(); openLecture(nid); }).catch(fail_(a));
      break;
    }

    // --- الفريق والإعدادات ---
    case 'mem-proj': {
      var mem = D.team.filter(function (x) { return x.chat === a.dataset.chat; })[0];
      var list = (mem.projects || []).slice(), pi = list.indexOf(a.dataset.p);
      if (pi === -1) list.push(a.dataset.p); else list.splice(pi, 1);
      a.disabled = true;
      api('updateMember', { chat: a.dataset.chat, projects: list }).then(function () { toast('اتحفظ ✓'); render(); })
        .catch(function (er) { toast(er.message, true); render(); });
      break;
    }
    case 'add-proj': $('projRows').insertAdjacentHTML('beforeend', projRow({ name: '', old: '', item: 'محاضرة', color: '#5a6b78', workDays: [], active: true })); break;
    case 'save-projects': {
      var prs = Array.prototype.map.call(document.querySelectorAll('#projRows .prow'), function (r) {
        return { old: r.dataset.old, name: r.querySelector('[name=pname]').value.trim(), item: r.querySelector('[name=pitem]').value.trim(),
          color: r.querySelector('[name=pcolor]').value, active: r.querySelector('[name=pact]').checked,
          workDays: Array.prototype.filter.call(r.querySelectorAll('[name=pwd]'), function (c) { return c.checked; }).map(function (c) { return Number(c.value); }) };
      }).filter(function (r) { return r.name || r.old; });
      busy(a, true);
      api('saveProjects', { projects: prs }).then(function () { busy(a, false); toast('اتحفظت المشاريع ✓'); render(); }).catch(fail_(a));
      break;
    }
    case 'save-settings': {
      var wd = Array.prototype.filter.call(document.querySelectorAll('[name=wd]'), function (c) { return c.checked; }).map(function (c) { return Number(c.value); });
      busy(a, true);
      api('saveSettings', { workDays: wd, hour: Number($('hour').value), adminHour: Number($('adminHour').value) })
        .then(function () { busy(a, false); toast('اتحفظت الإعدادات ✓'); render(); }).catch(fail_(a));
      break;
    }
  }
});

document.addEventListener('input', function (e) {
  if (e.target.id === 'q') { F.q = e.target.value; drawRows(); }
  if (e.target.closest && e.target.closest('#items')) saveDraft();
});

document.addEventListener('change', function (e) {
  var t = e.target;
  if (t.id === 'revFilter') { F.rev = t.value; drawRows(); return; }
  if (t.id === 'upProj') { setProj(t.value); return; }
  if (t.id === 'asgAll') { document.querySelectorAll('.asg [name=rev]').forEach(function (s) { s.value = t.value; }); return; }
  if (t.closest && t.closest('#items')) { saveDraft(); return; }
  if (t.dataset && t.dataset.mem) {
    var args = { chat: t.dataset.chat };
    args[t.dataset.mem] = t.type === 'checkbox' ? t.checked : t.value;
    t.disabled = true;
    api('updateMember', args).then(function () { toast('اتحفظ ✓'); render(); })
      .catch(function (er) { toast(er.message, true); render(); });
  }
});

  load();
  PROJ = S.proj || '';
  var h = location.hash;
  var m = /#login=([a-f0-9]{32})&api=([^&]+)/.exec(h);
  if (m) {
    try { history.replaceState(null, '', location.pathname); } catch (e) {}   // شيل الرمز من شريط العنوان
    S.api = decodeURIComponent(m[2]);
    $('login').classList.remove('hidden');
    $('loginMsg').innerHTML = '<div class="loading" style="padding:10px"><div class="spin"></div>جاري الدخول…</div>';
    fetch(S.api, { method: 'POST', body: JSON.stringify({ action: 'login', token: m[1] }) })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j.ok) throw new Error(j.error);
        S.session = j.result.session; S.name = j.result.name; save();
        showApp(); refresh().then(function () { toast('أهلًا ' + S.name + ' 👋'); });
      })
      .catch(function (e) { showLogin(e.message || 'مش قادر أوصل للسيرفر'); });
    return;
  }
  var pm = /#\/(\w+)/.exec(h); if (pm) PAGE = pm[1];
  if (S.api && S.session) {
    showApp();
    var c = loadCache();
    if (c) { D = c; if (!PAGE || !allowed(PAGE)) PAGE = defaultPage(D); render(); refresh(true); }   // عرض فوري لآخر بيانات، والتحديث في الخلفية
    else refresh();
  } else showLogin();
}

setInterval(function () {
  if (!D || document.hidden || !$('drawer').classList.contains('hidden')) return;
  var ae = document.activeElement;
  if (ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName)) return;
  if (PAGE === 'send') return;
  refresh(true);
}, 90000);

init();
})();
</script>
</body>
</html>
